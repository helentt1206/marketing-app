// ============ CONSTANTS ============
var NODE_W = 200, NODE_H = 44, H_GAP = 32, V_GAP = 16, CORNER_R = 8;
var svgEl = document.getElementById('svg');
var NS = 'http://www.w3.org/2000/svg';

// ============ HELPERS ============
function isLight(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return(r*299+g*587+b*114)/1000>160;
}
function darken(hex,amt){
  var r=Math.max(0,parseInt(hex.slice(1,3),16)*(1-amt));
  var g=Math.max(0,parseInt(hex.slice(3,5),16)*(1-amt));
  var b=Math.max(0,parseInt(hex.slice(5,7),16)*(1-amt));
  return '#'+[r,g,b].map(function(v){return Math.round(v).toString(16).padStart(2,'0')}).join('');
}

// ============ LAYOUT ============
var flatNodes=[], flatLinks=[];

function initCollapsed(d){
  if(d.collapsed!==undefined)d._collapsed=d.collapsed;
  else d._collapsed=false;
  if(d.children)d.children.forEach(initCollapsed);
}

function layout(){
  flatNodes=[];flatLinks=[];
  initCollapsed(treeData);
  var W=window.innerWidth, H=window.innerHeight;
  var rootX=120;

  function place(d,depth,yStart,ySpan){
    var x=rootX+depth*(NODE_W+H_GAP);
    var nKids=(d.children&&!d._collapsed)?d.children.length:1;
    var leafSpan=ySpan/nKids;
    var y=yStart+ySpan/2;
    var node={
      id:flatNodes.length, name:d.name, color:d.color||'#595959',
      emph:!!d.emph, x:x, y:y, w:NODE_W, h:NODE_H, depth:depth,
      hasKids:!!(d.children&&d.children.length>0), collapsed:!!d._collapsed
    };
    d._node=node;
    flatNodes.push(node);
    if(d.children&&!d._collapsed){
      for(var i=0;i<d.children.length;i++){
        var child=d.children[i];
        place(child,depth+1,yStart+i*leafSpan,leafSpan);
        flatLinks.push({s:node.id,t:child._node.id});
      }
    }
  }
  place(treeData,0,80,H-160);

  // Fix overlaps
  var byDepth={};
  flatNodes.forEach(function(n){
    if(!byDepth[n.depth])byDepth[n.depth]=[];
    byDepth[n.depth].push(n);
  });
  for(var key in byDepth){
    var arr=byDepth[key];
    arr.sort(function(a,b){return a.y-b.y});
    for(var i=1;i<arr.length;i++){
      if(arr[i].y-arr[i-1].y<NODE_H+V_GAP) arr[i].y=arr[i-1].y+NODE_H+V_GAP;
    }
  }
}

// ============ RENDER ============
var mainG, linkG, nodeG;

function render(){
  while(svgEl.firstChild)svgEl.removeChild(svgEl.firstChild);

  var defs=document.createElementNS(NS,'defs');
  var filter=document.createElementNS(NS,'filter');
  filter.setAttribute('id','sd');
  filter.setAttribute('x','-10%');filter.setAttribute('y','-10%');
  filter.setAttribute('width','130%');filter.setAttribute('height','130%');
  var fe=document.createElementNS(NS,'feDropShadow');
  fe.setAttribute('dx','1');fe.setAttribute('dy','2');
  fe.setAttribute('stdDeviation','3');fe.setAttribute('flood-opacity','0.12');
  filter.appendChild(fe);defs.appendChild(filter);
  svgEl.appendChild(defs);

  mainG=document.createElementNS(NS,'g');
  svgEl.appendChild(mainG);

  linkG=document.createElementNS(NS,'g');
  linkG.setAttribute('class','links');
  mainG.appendChild(linkG);

  nodeG=document.createElementNS(NS,'g');
  nodeG.setAttribute('class','nodes');
  mainG.appendChild(nodeG);

  // Links
  var linkSet={};
  flatLinks.forEach(function(l){linkSet[l.s+'-'+l.t]={s:l.s,t:l.t}});
  for(var k in linkSet){
    var l=linkSet[k];
    var s=flatNodes[l.s], t=flatNodes[l.t];
    var sx=s.x+NODE_W, sy=s.y+NODE_H/2, ex=t.x, ey=t.y+NODE_H/2;
    var mx=(sx+ex)/2;
    var d='M'+sx+','+sy+' C'+mx+','+sy+' '+mx+','+ey+' '+ex+','+ey;
    var p=document.createElementNS(NS,'path');
    p.setAttribute('d',d);
    p.setAttribute('fill','none');
    p.setAttribute('stroke','#c0c0c0');
    p.setAttribute('stroke-width','1.5');
    p.setAttribute('stroke-opacity','0.6');
    p.setAttribute('data-s',l.s);
    p.setAttribute('data-t',l.t);
    linkG.appendChild(p);
  }

  // Nodes
  flatNodes.forEach(function(n){
    var g=document.createElementNS(NS,'g');
    g.setAttribute('transform','translate('+n.x+','+n.y+')');
    g.setAttribute('class','node');
    g.style.cursor=n.hasKids?'pointer':'default';
    g.setAttribute('data-id',n.id);
    g.addEventListener('click',function(ev){ev.stopPropagation();toggleNode(n);});

    var rect=document.createElementNS(NS,'rect');
    rect.setAttribute('width',n.w);
    rect.setAttribute('height',n.h);
    rect.setAttribute('rx',CORNER_R);
    rect.setAttribute('ry',CORNER_R);
    rect.setAttribute('fill',n.emph?darken(n.color,0.08):n.color);
    rect.setAttribute('stroke',n.emph?darken(n.color,0.2):'rgba(0,0,0,0.08)');
    rect.setAttribute('stroke-width',n.emph?'2.5':'1');
    rect.setAttribute('filter','url(#sd)');
    g.appendChild(rect);

    // Collapse indicator
    if(n.hasKids){
      var cx=n.w-14, cy=n.h/2;
      var circle=document.createElementNS(NS,'circle');
      circle.setAttribute('cx',cx);circle.setAttribute('cy',cy);circle.setAttribute('r','8');
      circle.setAttribute('fill','rgba(255,255,255,0.35)');
      circle.setAttribute('stroke','rgba(255,255,255,0.6)');
      circle.setAttribute('stroke-width','1');
      g.appendChild(circle);
      var txt=document.createElementNS(NS,'text');
      txt.setAttribute('x',cx);txt.setAttribute('y',cy);
      txt.setAttribute('dy','0.35em');
      txt.setAttribute('text-anchor','middle');
      txt.setAttribute('fill','#fff');
      txt.setAttribute('font-size','11');
      txt.setAttribute('font-weight','bold');
      txt.textContent=n.collapsed?'+':'−';
      g.appendChild(txt);
    }

    // Text
    var lines=n.name.split('\n');
    var fs=lines.length>3?10:lines.length>2?11:12;
    var tc=isLight(n.color)?'#1a1a1a':'#fff';
    var totalH=lines.length*(fs+3)-3;
    lines.forEach(function(line,i){
      var ty=n.h/2-totalH/2+i*(fs+3)+fs*0.35;
      var txt=document.createElementNS(NS,'text');
      txt.setAttribute('x',n.hasKids?'14':n.w/2);
      txt.setAttribute('y',ty);
      txt.setAttribute('text-anchor',n.hasKids?'start':'middle');
      txt.setAttribute('fill',tc);
      txt.setAttribute('font-size',fs);
      txt.setAttribute('font-weight',n.emph?'bold':'normal');
      txt.setAttribute('font-family','Microsoft YaHei,PingFang SC,sans-serif');
      txt.textContent=line;
      g.appendChild(txt);
    });

    nodeG.appendChild(g);
  });
}

// ============ TREE OPS ============
function findData(d,id){
  if(d._node&&d._node.id===id)return d;
  if(d.children)for(var i=0;i<d.children.length;i++){var r=findData(d.children[i],id);if(r)return r;}
  return null;
}

function toggleNode(node){
  var d=findData(treeData,node.id);
  if(d&&d.children&&d.children.length>0){
    d._collapsed=!d._collapsed;
    layout();render();applyTransform();
    var q=document.getElementById('searchInput').value.trim();
    if(q)highlight(q);
  }
}

function expandAll(){
  (function e(d){d._collapsed=false;if(d.children)d.children.forEach(e);})(treeData);
  layout();render();applyTransform();
}
function collapseAll(){
  (function c(d,dp){if(dp>=2)d._collapsed=true;if(d.children)d.children.forEach(function(ch){c(ch,dp+1)});})(treeData,0);
  layout();render();applyTransform();
}

// ============ SEARCH ============
function highlight(q){
  q=q.toLowerCase();
  var match=[];
  flatNodes.forEach(function(n){if(n.name.toLowerCase().indexOf(q)>=0)match[n.id]=true;});
  var ng=nodeG.querySelectorAll('.node');
  for(var i=0;i<ng.length;i++){
    var id=parseInt(ng[i].getAttribute('data-id'));
    ng[i].style.opacity=match[id]?'1':'0.15';
  }
  var lp=linkG.querySelectorAll('path');
  for(var i=0;i<lp.length;i++){
    var s=parseInt(lp[i].getAttribute('data-s'));
    var t=parseInt(lp[i].getAttribute('data-t'));
    lp[i].setAttribute('stroke-opacity',(match[s]||match[t])?'0.6':'0.06');
  }
}
function clearHighlight(){
  var ng=nodeG.querySelectorAll('.node');
  for(var i=0;i<ng.length;i++)ng[i].style.opacity='1';
  var lp=linkG.querySelectorAll('path');
  for(var i=0;i<lp.length;i++)lp[i].setAttribute('stroke-opacity','0.6');
}

// ============ ZOOM & PAN ============
var tx=0, ty=0, scale=1;

function applyTransform(){
  mainG.setAttribute('transform','translate('+tx+','+ty+') scale('+scale+')');
}

var panning=false, panSX=0, panSY=0, panTX=0, panTY=0;

svgEl.addEventListener('mousedown',function(ev){
  if(ev.target===svgEl||ev.target.tagName==='svg'||ev.target===mainG){
    panning=true;panSX=ev.clientX;panSY=ev.clientY;panTX=tx;panTY=ty;
    svgEl.style.cursor='grabbing';
  }
});
window.addEventListener('mousemove',function(ev){
  if(!panning)return;
  tx=panTX+(ev.clientX-panSX);ty=panTY+(ev.clientY-panSY);
  applyTransform();
});
window.addEventListener('mouseup',function(){panning=false;svgEl.style.cursor='';});
svgEl.addEventListener('wheel',function(ev){
  ev.preventDefault();
  var ds=ev.deltaY>0?0.9:1.1;
  var ns=Math.min(3,Math.max(0.15,scale*ds));
  var mx=ev.clientX,my=ev.clientY;
  tx=mx-(mx-tx)*(ns/scale);
  ty=my-(my-ty)*(ns/scale);
  scale=ns;
  applyTransform();
},{passive:false});

function fitView(){
  var bb=mainG.getBBox();
  var W=window.innerWidth,H=window.innerHeight,pad=80;
  scale=Math.min(W/(bb.width+pad*2),H/(bb.height+pad*2),1.2);
  tx=(W-bb.width*scale)/2-bb.x*scale;
  ty=(H-bb.height*scale)/2-bb.y*scale;
  applyTransform();
}

// ============ INIT ============
layout();
render();
applyTransform();
setTimeout(function(){
  fitView();
  showStatus('✅ 思维导图已就绪', 'ok');
  setTimeout(function(){statusEl.style.display='none';},1500);
},200);

document.getElementById('btnFit').addEventListener('click',fitView);
document.getElementById('btnExpand').addEventListener('click',expandAll);
document.getElementById('btnCollapse').addEventListener('click',collapseAll);
document.getElementById('searchInput').addEventListener('input',function(){
  var q=this.value.trim();
  if(q)highlight(q);else clearHighlight();
});

var rt;
window.addEventListener('resize',function(){
  clearTimeout(rt);
  rt=setTimeout(function(){layout();render();applyTransform();},200);
});

// Success
console.log('MindMap: rendered '+flatNodes.length+' nodes, '+flatLinks.length+' links');

}catch(e){
  showStatus('⚠️ 加载失败: '+e.message, 'err');
  console.error(e);
}
})();
</script>
